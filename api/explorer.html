<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNAS explorer</title>
<style>
  :root {
    --bg:#0b0f0c; --panel:#111814; --border:#1f2d25; --fg:#c9f7d8;
    --muted:#5f8a72; --accent:#3fff9f; --accent2:#39d0ff; --warn:#ffcc66; --bad:#ff6b6b;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  a { color:var(--accent2); }
  header {
    padding:14px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header h1 { margin:0; font-size:18px; color:var(--accent); letter-spacing:1px; }
  header .sub { color:var(--muted); font-size:12px; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px; }
  .chip {
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; min-width:110px;
  }
  .chip .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .chip .v { color:var(--accent); font-size:16px; word-break:break-all; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted);
       border-bottom:1px solid var(--border); padding-bottom:6px; margin:26px 0 12px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px;
          padding:10px 12px; margin-bottom:8px; }
  .block { cursor:pointer; }
  .block .row { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .idx { color:var(--accent); font-weight:bold; }
  .mono { word-break:break-all; }
  .muted { color:var(--muted); }
  .txs { margin-top:8px; border-top:1px dashed var(--border); padding-top:8px; display:none; }
  .tx { padding:4px 0; border-bottom:1px dotted var(--border); font-size:13px; }
  .tx:last-child { border-bottom:none; }
  .tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px;
         border:1px solid var(--border); color:var(--muted); }
  .tag.cb { color:var(--warn); border-color:var(--warn); }
  .charts { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:8px; }
  .chart { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .chart .title { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .chart .now { color:var(--accent); font-size:15px; margin:2px 0 6px; }
  .chart svg { display:block; width:100%; height:60px; }
  .chart .range { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; }
  .rich td, .rich th { padding:4px 8px; text-align:left; border-bottom:1px dotted var(--border); }
  .rich { width:100%; border-collapse:collapse; font-size:13px; }
  .rich th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .rich td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { height:6px; background:var(--accent); border-radius:3px; min-width:1px; }
  input, button {
    font:inherit; background:#0e150f; color:var(--fg);
    border:1px solid var(--border); border-radius:6px; padding:7px 9px;
  }
  input { width:100%; }
  button { cursor:pointer; color:var(--accent); border-color:var(--accent); background:#0e1a12; }
  button:hover { background:#12241a; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:760px){ .grid { grid-template-columns:1fr; } }
  .field { margin-bottom:8px; }
  .field label { display:block; color:var(--muted); font-size:11px; margin-bottom:3px; }
  .result { margin-top:10px; font-size:13px; white-space:pre-wrap; word-break:break-all; }
  .ok { color:var(--accent); } .no { color:var(--bad); }
  .offline { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>⛓ DNAS</h1>
  <span class="sub">Definitely Not A Scam — block explorer &amp; light-client verifier</span>
  <span class="sub" id="status" style="margin-left:auto"></span>
</header>

<div class="wrap">
  <div class="chips" id="chips"></div>

  <div class="card">
    <div class="field"><label>search — a height, a block hash, a transaction hash, or an address</label>
      <input id="search" placeholder="1234 · block hash · tx hash · dnas…"
             onkeydown="if(event.key==='Enter')doSearch()"></div>
    <button onclick="doSearch()">Search</button>
    <div class="result" id="searchResult"></div>
  </div>

  <div class="grid">
    <div>
      <h2>This node's wallet</h2>
      <div class="card">
        <div class="muted">address</div>
        <div class="mono" id="myaddr">…</div>
        <div style="margin-top:6px"><span class="muted">balance</span> <span id="mybal" class="idx">…</span></div>
      </div>
      <div class="card">
        <div class="field"><label>send to (address or dnas: URI)</label><input id="sendTo" placeholder="dnas… or dnas:ADDR?amount=2.5" oninput="applyPaymentURI()"></div>
        <div class="field"><label>amount (DNAS)</label><input id="sendAmt" value="1"></div>
        <div class="field"><label>fee (DNAS)</label><input id="sendFee" value="0.1"></div>
        <div class="field"><label>memo (optional)</label><input id="sendMemo" placeholder=""></div>
        <button onclick="doSend()">Send</button>
        <div class="result" id="sendResult"></div>
      </div>
    </div>

    <div>
      <h2>Lookups</h2>
      <div class="card">
        <div class="field"><label>address balance</label><input id="lookAddr" placeholder="dnas…"></div>
        <button onclick="lookupAddr()">Look up balance</button>
        <div class="result" id="addrResult"></div>
      </div>
      <div class="card">
        <div class="field"><label>verify a transaction (SPV, in your browser)</label>
          <input id="lookTx" placeholder="tx hash"></div>
        <button onclick="verifyTx()">Fetch proof &amp; verify</button>
        <div class="result" id="txResult"></div>
      </div>
    </div>
  </div>

  <h2>Recent blocks</h2>
  <div id="blocks"></div>

  <h2>Mempool (<span id="mpcount">0</span>)</h2>
  <div id="mempool"></div>

  <h2>Assets</h2>
  <div id="assets"></div>

  <h2>Over time</h2>
  <div class="charts" id="charts"></div>

  <h2>Rich list</h2>
  <div id="richlist"></div>

  <h2>This node</h2>
  <div id="nodeinfo"></div>
</div>

<script>
const COIN = 100000000;
const short = (h, n=12) => (h && h.length > n) ? h.slice(0, n) + "…" : (h || "");
const fmt = u => (Number(u) / COIN).toFixed(8);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const when = ts => new Date(Number(ts) * 1000).toLocaleString();

async function j(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ("HTTP " + r.status));
  return r.json();
}

// jAny is j for the endpoints whose FAILURE is also a documented answer:
// /health returns 503 with the reasons a node is not ready, and treating that as
// a transport error throws away the very thing it came to say — the readiness
// line would simply be missing on exactly the nodes that are not ready.
async function jAny(url) {
  const r = await fetch(url);
  return r.json().catch(() => null);
}

// SHA-256 helpers so the browser can verify proofs like a light client.
async function sha256hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function foldProof(leaf, proof) {
  let h = leaf;
  for (const s of proof) h = s.right ? await sha256hex(h + s.hash) : await sha256hex(s.hash + h);
  return h;
}
async function headerHash(hd) {
  return sha256hex(`${hd.index}|${hd.timestamp}|${hd.prev_hash}|${hd.merkle_root}|${hd.state_root}|${hd.base_fee}|${hd.bits}|${hd.nonce}`);
}
// Compact "bits" proof-of-work target (Bitcoin-style nBits), mirroring
// core.CompactToBig, so the browser verifies PoW against the real 256-bit target.
function compactToBig(bits) {
  const mantissa = BigInt(bits & 0x007fffff), exponent = BigInt(bits >>> 24);
  return exponent <= 3n ? mantissa >> (8n * (3n - exponent)) : mantissa << (8n * (exponent - 3n));
}
const POW_LIMIT = compactToBig(0x1f0fffff);
function meetsTarget(hashHex, bits) {
  const target = compactToBig(bits);
  if (target <= 0n || target > POW_LIMIT) return false;
  return BigInt("0x" + hashHex) <= target;
}
function difficultyOf(bits) {
  const target = compactToBig(bits);
  return target <= 0n ? 0 : Number((POW_LIMIT * 1000n) / target) / 1000;
}

// A transaction line has to be able to describe every form the ledger allows,
// not just the plain one: a page that renders a multi-output payment as a
// transfer of zero to nobody, or drops a memo and a deadline that are signed
// parts of the transaction, is showing something that did not happen.
function txLine(tx) {
  if (tx.from === "COINBASE")
    return `<div class="tx"><span class="tag cb">coinbase</span> → ${short(tx.to)} <span class="idx">+${fmt(tx.amount)}</span></div>`;

  let head;
  if (tx.outputs && tx.outputs.length) {
    const total = tx.outputs.reduce((n, o) => n + Number(o.amount), 0);
    head = `${short(tx.from)} → ${tx.outputs.length} recipients <span class="idx">${fmt(total)}</span>`;
  } else if (tx.issue) {
    head = `${short(tx.from)} <span class="tag">issues</span> ${esc(tx.issue.ticker)} ` +
      `<span class="idx">${tx.issue.supply}</span> units`;
  } else if (tx.asset_id) {
    head = `${short(tx.from)} → ${short(tx.to)} <span class="idx">${tx.amount}</span> ` +
      `<span class="muted">of ${short(tx.asset_id, 10)}</span>`;
  } else {
    head = `${short(tx.from)} → ${short(tx.to)} <span class="idx">${fmt(tx.amount)}</span>`;
  }

  const notes = [`fee ${fmt(tx.fee)}`, `nonce ${tx.nonce}`];
  if (tx.lock_until) notes.push(`not before ${tx.lock_until}`);
  if (tx.expiry) notes.push(`exp@${tx.expiry}`);
  if (tx.multisig) notes.push(`${tx.multisig.threshold}-of-${(tx.multisig.pubkeys || []).length} multisig`);
  if (tx.htlc) notes.push(tx.preimage ? "HTLC claim" : "HTLC refund");
  if (tx.vault) notes.push("vault");
  if (tx.fee_payer) notes.push(`fee paid by ${short(tx.fee_payer, 10)}`);
  // A memo is arbitrary data from a stranger, so it is escaped like everything
  // else on this page — it is the one field an attacker chooses freely.
  const memo = tx.memo ? ` <span class="muted">“${esc(tx.memo)}”</span>` : "";

  let line = `<div class="tx">${head} <span class="muted">${notes.join(" · ")}</span>${memo}`;
  if (tx.outputs && tx.outputs.length) {
    line += tx.outputs.map(o =>
      `<div class="muted mono">  → ${short(o.to)} ${fmt(o.amount)}</div>`).join("");
  }
  return line + `</div>`;
}

function renderBlocks(chain) {
  const el = document.getElementById("blocks");
  el.innerHTML = "";
  for (const b of chain.slice().reverse().slice(0, 15)) {
    const card = document.createElement("div");
    card.className = "card block";
    const txs = (b.transactions || []);
    card.innerHTML =
      `<div class="row"><span><span class="idx">#${b.index}</span> <span class="mono muted">${short(b.hash, 16)}</span></span>`
      + `<span class="muted">${txs.length} tx · diff ${difficultyOf(b.bits).toFixed(2)} · ${when(b.timestamp)}</span></div>`
      + `<div class="txs">${txs.map(txLine).join("") || '<span class="muted">no transactions</span>'}</div>`;
    card.onclick = () => {
      const t = card.querySelector(".txs");
      t.style.display = t.style.display === "block" ? "none" : "block";
    };
    el.appendChild(card);
  }
}

function renderMempool(txs) {
  document.getElementById("mpcount").textContent = txs.length;
  const el = document.getElementById("mempool");
  el.innerHTML = txs.length
    ? txs.map(t => `<div class="card">${txLine(t)}</div>`).join("")
    : '<div class="card muted">empty</div>';
}

// One box for every kind of identifier, because a person looking something up
// has a string, not a category: a height, a block hash, a transaction hash or an
// address. Guessing from the shape of the input is what makes it one box —
// heights are digits, addresses carry the dnas prefix and a checksum, and the
// two 64-character hashes are told apart by asking the node.
async function doSearch() {
  const raw = document.getElementById("search").value.trim();
  const out = document.getElementById("searchResult");
  if (!raw) { out.textContent = ""; return; }
  out.textContent = "looking…";
  try {
    if (/^[0-9]+$/.test(raw)) { out.innerHTML = await searchHeight(raw); return; }
    if (raw.startsWith("dnas")) { out.innerHTML = await searchAddress(raw); return; }
    if (/^[0-9a-fA-F]{64}$/.test(raw)) { out.innerHTML = await searchHash(raw.toLowerCase()); return; }
    out.textContent = "that is not a height, an address, or a 64-character hash";
  } catch (e) {
    out.textContent = "not found: " + e.message;
  }
}

async function searchHeight(h) {
  const b = await j("/block/" + h);
  return `<div class="mono">block ${b.index} — ${esc(b.hash)}</div>` +
    `<div class="muted">${when(b.timestamp)} · ${(b.transactions || []).length} tx · ` +
    `state root ${short(b.state_root, 16)}</div>` +
    (b.transactions || []).map(t => txLine(t)).join("");
}

async function searchAddress(a) {
  const acc = await j("/account/" + a);
  let html = `<div class="mono">${esc(a)}</div><div>balance <span class="idx">${esc(acc.balance_fmt)}</span>` +
    ` · nonce ${acc.nonce}</div>`;
  // An account holding assets looked empty before: the balance line is coin only.
  const assets = acc.assets || {};
  for (const [id, amount] of Object.entries(assets)) {
    html += `<div class="muted mono">${amount} units of ${esc(short(id, 16))}</div>`;
  }
  return html;
}

// A 64-character hash is either a transaction or a block, and the node is the
// thing that knows which. Transactions are tried first because that is what
// somebody pasting a hash almost always has.
async function searchHash(h) {
  try {
    const st = await j("/tx/" + h);
    const t = st.tx || {};
    return `<div class="mono">transaction ${esc(h)}</div>` +
      `<div class="muted">${esc(st.status)}${st.status === "confirmed" ?
        ` in block ${st.height} · ${st.confirmations} confirmation(s)` : ""}</div>` +
      txLine(t);
  } catch (e) {
    // Not a transaction: walk the recent blocks for a matching hash. Only the
    // recent ones, because a node has no index from block hash to height —
    // saying so is better than pretending the search covered the whole chain.
    const chain = await j("/chain?last=200");
    const b = (chain || []).find(b => b.hash === h);
    if (!b) throw new Error("no transaction with that hash, and no block with it in the last 200");
    return await searchHeight(b.index);
  }
}

function renderAssets(list) {
  const el = document.getElementById("assets");
  if (!list || !list.length) {
    el.innerHTML = '<div class="card muted">none issued on this chain</div>';
    return;
  }
  // The same ticker from two issuers is legitimate and is the one thing here
  // that can mislead, so the issuer is always shown next to it.
  el.innerHTML = list.map(a => `<div class="card">
      <span class="idx">${esc(a.ticker)}</span>
      <span class="mono muted">${esc(short(a.id, 16))}</span>
      <div class="muted">supply ${a.supply} · issued in block ${a.height} · issuer ${esc(short(a.issuer, 14))}</div>
    </div>`).join("");
}

// What this node can and cannot answer. A pruning or fast-synced node cannot
// serve old bodies, their proofs or their filters, and a page that did not say
// so would make "not found" look like "not in the chain".
// sparkline draws a series as an inline SVG path. No chart library: the page is
// served by the node itself and must work on a machine with no internet, so
// everything it draws it draws itself.
//
// The y-axis is scaled to the data's own range rather than to zero. For the
// quantities here — difficulty, base fee, block interval — the interesting part
// is nearly always the variation, and anchoring at zero flattens a retarget into
// a straight line.
function sparkline(values) {
  const n = values.length;
  if (n === 0) return '<svg viewBox="0 0 100 30" preserveAspectRatio="none"></svg>';
  if (n === 1) return `<svg viewBox="0 0 100 30" preserveAspectRatio="none">` +
    `<path d="M0 15 L100 15" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
  let lo = Infinity, hi = -Infinity;
  for (const v of values) { if (v < lo) lo = v; if (v > hi) hi = v; }
  const span = (hi - lo) || 1;
  const pts = values.map((v, i) => {
    const x = (i / (n - 1)) * 100;
    // SVG's y grows downward, so a larger value must map to a SMALLER y.
    const y = 28 - ((v - lo) / span) * 26;
    return `${x.toFixed(2)} ${y.toFixed(2)}`;
  });
  const line = "M" + pts.join(" L");
  const area = line + ` L100 30 L0 30 Z`;
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none">`
    + `<path d="${area}" fill="var(--accent)" opacity="0.12"/>`
    + `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.5"` +
      ` vector-effect="non-scaling-stroke"/></svg>`;
}

function renderCharts(series) {
  const el = document.getElementById("charts");
  if (!series || series.length === 0) {
    el.innerHTML = `<div class="chart muted">no data yet</div>`;
    return;
  }
  // Heights 0 and 1 carry no usable interval. Genesis has nothing before it, and
  // genesis's timestamp is a fixed constant years before any chain is actually
  // mined — so block 1's "interval" is the age of that constant, not how long the
  // block took. Plotting it puts a value of tens of millions next to values of
  // tens, which flattens every real block onto the axis.
  const intervals = series.filter(p => Number(p.height) > 1).map(p => Number(p.interval));
  const panels = [
    ["difficulty", series.map(p => Number(p.difficulty)), v => v.toFixed(2)],
    ["base fee / byte", series.map(p => Number(p.base_fee)), v => String(v)],
    ["block interval (s)", intervals, v => v.toFixed(0)],
    ["transactions / block", series.map(p => Number(p.txs)), v => v.toFixed(0)],
    ["fees / block", series.map(p => Number(p.fees) / COIN), v => v.toFixed(4)],
  ];
  el.innerHTML = panels.map(([title, values, fmtv]) => {
    if (values.length === 0) return "";
    const now = values[values.length - 1];
    const lo = Math.min(...values), hi = Math.max(...values);
    return `<div class="chart">`
      + `<div class="title">${esc(title)}</div>`
      + `<div class="now">${esc(fmtv(now))}</div>`
      + sparkline(values)
      + `<div class="range"><span>min ${esc(fmtv(lo))}</span>`
      + `<span>${values.length} blocks</span>`
      + `<span>max ${esc(fmtv(hi))}</span></div>`
      + `</div>`;
  }).join("");
}

function renderRichList(rl) {
  const el = document.getElementById("richlist");
  if (!rl || !rl.entries || rl.entries.length === 0) {
    el.innerHTML = `<div class="card muted">nobody holds any coin yet</div>`;
    return;
  }
  const top = rl.entries[0].percent || 1;
  const rows = rl.entries.map(e => {
    const pct = Number(e.percent) || 0;
    // Bars are scaled against the LARGEST holder, not against 100%: on a young
    // chain where one miner holds nearly everything, scaling to 100 makes every
    // other bar invisible.
    const width = Math.max(1, Math.round((pct / top) * 100));
    return `<tr>`
      + `<td class="num">${e.rank}</td>`
      + `<td class="mono"><a href="#" onclick="searchAddress('${esc(e.address)}');return false">${esc(short(e.address, 24))}</a></td>`
      + `<td class="num">${esc(e.balance_fmt)}</td>`
      + `<td class="num">${pct.toFixed(2)}%</td>`
      + `<td style="width:120px"><div class="bar" style="width:${width}%"></div></td>`
      + `</tr>`;
  }).join("");
  el.innerHTML = `<div class="card">`
    + `<div class="muted" style="margin-bottom:6px">`
    + `top ${rl.shown} of ${rl.accounts} account(s) hold ${Number(rl.top_share).toFixed(2)}% `
    + `of ${esc(fmt(rl.circulating))} ${esc("DNAS")}</div>`
    + `<table class="rich"><thead><tr>`
    + `<th>#</th><th>address</th><th style="text-align:right">balance</th>`
    + `<th style="text-align:right">share</th><th></th>`
    + `</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderNodeInfo(info, health, stats, reorgs) {
  const rows = [];
  if (health) {
    rows.push(health.ok
      ? `<span class="ok">ready</span> — tip ${esc(health.tip_age || "?")} old, ${health.blocks_behind || 0} behind`
      : `<span class="offline">NOT READY</span> — ${esc((health.reasons || []).join("; "))}`);
  }
  if (stats && stats.window > 1) {
    rows.push(`hashrate ${esc(stats.hashrate_fmt)} · median block interval ${stats.median_interval}s ` +
      `against a ${stats.target_interval}s target`);
  }
  if (reorgs) {
    rows.push(`${reorgs.total} reorg(s), deepest ${reorgs.deepest} of a ${reorgs.max_depth} limit · ` +
      `${reorgs.orphans} orphan block(s) buffered`);
  }
  if (info) {
    rows.push(info.pruned
      ? `<span class="muted">pruned</span>: bodies from height ${info.body_height} ` +
        `(keeping ${info.prune_keep}; ${info.pruned_bodies} discarded). Older bodies, proofs and ` +
        `filters must come from another node.`
      : `holding every block body from height ${info.body_height}`);
    if (info.filter_base > 0) {
      rows.push(`<span class="muted">filter headers start at height ${info.filter_base}</span> ` +
        `(this node fast-synced, so it never saw the bodies below that)`);
    }
    if (info.webhooks) rows.push("webhooks configured");
    if (info.address_index) rows.push("address index enabled (/address/{addr}/history)");
    if (info.faucet) rows.push("faucet enabled");
  }
  document.getElementById("nodeinfo").innerHTML =
    `<div class="card">${rows.map(r => `<div>${r}</div>`).join("")}</div>`;
}

async function refresh() {
  const st = document.getElementById("status");
  try {
    // ?last= asks for the NEWEST blocks. The bulk reads are paged, so a plain
    // /chain returns the first page — past the page limit that is the oldest
    // blocks, and this panel would sit frozen in the distant past.
    const [info, chain, mp, supply] = await Promise.all(
      [j("/info"), j("/chain?last=12"), j("/mempool"), j("/supply")]);
    // The panels below are best-effort: a node that predates any of these
    // endpoints still renders the rest of the page rather than going blank.
    const [assets, health, stats, reorgs, series, rich] = await Promise.all([
      j("/assets").catch(() => null),
      jAny("/health").catch(() => null),
      j("/chainstats").catch(() => null),
      j("/reorgs").catch(() => null),
      j("/series?last=144").catch(() => null),
      j("/richlist?limit=15").catch(() => null),
    ]);
    const chips = [
      // Which chain this is. Testnet and regtest have their own genesis and their
      // own signatures, so it matters that the page says which one you are on.
      ["network", info.network || "mainnet"],
      ["height", info.height],
      ["tip", short(info.tip, 10)],
      ["next diff", Number(info.next_difficulty).toFixed(2)],
      ["work", info.work],
      ["mempool", info.mempool],
      ["base fee", fmt(info.base_fee)],
      ["peers", (info.peers || []).length],
      ["circulating", supply.circulating_fmt],
      ["burned", supply.burned_fmt],
    ];
    // minted − burned == circulating holds for every valid chain; surface a break.
    if (!supply.consistent) chips.push(["supply", "INCONSISTENT"]);
    document.getElementById("chips").innerHTML =
      chips.map(([k, v]) => `<div class="chip"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join("");
    renderBlocks(chain);
    renderMempool(mp || []);
    renderAssets(assets);
    renderCharts(series);
    renderRichList(rich);
    renderNodeInfo(info, health, stats, reorgs);
    st.textContent = "● live";
    st.className = "sub ok";
  } catch (e) {
    st.textContent = "● offline: " + e.message;
    st.className = "sub offline";
  }
}

async function refreshWallet() {
  try {
    const { address } = await j("/address");
    document.getElementById("myaddr").textContent = address;
    const bal = await j("/balance/" + address);
    document.getElementById("mybal").textContent = bal.balance_fmt;
    if (!document.getElementById("lookAddr").value) document.getElementById("lookAddr").value = address;
  } catch (e) {
    document.getElementById("myaddr").textContent = "(no wallet)";
  }
}

// A `dnas:` payment URI is what a payee hands over, and this form is where
// somebody would paste it. Pasting one fills in the amount and memo it carries,
// so neither has to be retyped -- retyping the address in particular is what a
// URI exists to prevent, since consensus does not check recipient checksums.
//
// Format: dnas:ADDRESS?amount=DECIMAL&memo=TEXT&ref=TOKEN
function parsePaymentURI(s) {
  s = (s || "").trim();
  if (!/^dnas:/i.test(s)) return null;
  let rest = s.slice("dnas:".length).replace(/^\/\//, "");
  const q = rest.indexOf("?");
  let addr = q < 0 ? rest : rest.slice(0, q);
  const query = q < 0 ? "" : rest.slice(q + 1);
  try { addr = decodeURIComponent(addr); } catch (e) { return null; }
  addr = addr.trim();
  if (!addr) return null;
  const p = new URLSearchParams(query);
  return { address: addr, amount: (p.get("amount") || "").trim(), memo: p.get("memo") || "" };
}

// applyPaymentURI expands a URI pasted into the recipient field, in place.
function applyPaymentURI() {
  const el = document.getElementById("sendTo");
  const uri = parsePaymentURI(el.value);
  if (!uri) return;
  el.value = uri.address;
  if (uri.amount) document.getElementById("sendAmt").value = uri.amount;
  if (uri.memo) document.getElementById("sendMemo").value = uri.memo;
  document.getElementById("sendResult").innerHTML =
    '<span class="ok">read payment URI</span> — check the amount before sending';
}

async function doSend() {
  const out = document.getElementById("sendResult");
  try {
    // Paste-then-click-Send without leaving the field still works: expand first.
    applyPaymentURI();
    const body = JSON.stringify({
      to: document.getElementById("sendTo").value.trim(),
      amount: Math.round(parseFloat(document.getElementById("sendAmt").value) * COIN),
      fee: Math.round(parseFloat(document.getElementById("sendFee").value || "0") * COIN),
      memo: document.getElementById("sendMemo").value,
    });
    const res = await j("/send", { method: "POST", body });
    out.innerHTML = `<span class="ok">submitted</span> ${short(res.hash, 20)} (nonce ${res.nonce})`;
    refresh();
  } catch (e) { out.innerHTML = `<span class="no">rejected: ${esc(e.message)}</span>`; }
}

async function lookupAddr() {
  const out = document.getElementById("addrResult");
  try {
    const a = document.getElementById("lookAddr").value.trim();
    const acc = await j("/account/" + a);
    out.innerHTML = `balance <span class="ok">${fmt(acc.balance)} DNAS</span> · nonce ${acc.nonce}`;
  } catch (e) { out.innerHTML = `<span class="no">${esc(e.message)}</span>`; }
}

async function verifyTx() {
  const out = document.getElementById("txResult");
  const txh = document.getElementById("lookTx").value.trim();
  out.textContent = "verifying…";
  try {
    // A transaction the node has only seen, not mined, has no inclusion proof yet.
    const st = await j("/tx/" + txh);
    if (st.status === "pending") {
      out.innerHTML = `<span class="ok">pending</span> in the mempool · 0 confirmations\n`
        + `<span class="muted">no inclusion proof until it is mined</span>`;
      return;
    }
    const pr = await j("/proof/" + txh);                 // full node supplies proof
    const hd = await j("/header/" + pr.block_index);     // ...and the block header
    const powOK = (await headerHash(hd)) === hd.hash && meetsTarget(hd.hash, hd.bits);
    const root = await foldProof(txh, pr.proof);         // fold the proof ourselves
    const incOK = root === hd.merkle_root;
    out.innerHTML =
      `block <span class="ok">#${pr.block_index}</span> · ${pr.confirmations} confirmation(s)\n`
      + `header PoW: <span class="${powOK ? "ok" : "no"}">${powOK ? "valid ✓" : "INVALID ✗"}</span>\n`
      + `merkle proof folds to header root: <span class="${incOK ? "ok" : "no"}">${incOK ? "yes ✓" : "NO ✗"}</span>\n`
      + ((powOK && incOK)
          ? `<span class="ok">⇒ transaction is provably in the chain</span>`
          : `<span class="no">⇒ verification FAILED</span>`);
  } catch (e) { out.innerHTML = `<span class="no">${esc(e.message)}</span>`; }
}

async function tick() { await refresh(); await refreshWallet(); }
tick();

// Live push via Server-Sent Events: refresh immediately on every block, reorg,
// or mempool transaction. A slow interval remains as a safety net (and covers
// browsers without EventSource or a briefly dropped stream).
if (window.EventSource) {
  const es = new EventSource("/events");
  for (const ev of ["block", "reorg", "tx"]) es.addEventListener(ev, tick);
}
setInterval(tick, window.EventSource ? 10000 : 2000);
</script>
</body>
</html>
